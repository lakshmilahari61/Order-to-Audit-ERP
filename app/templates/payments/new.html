{% extends "base.html" %}

{% block title %}Record Customer Payment — {{ factory_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white py-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-cash-stack"></i> Record Inward Payment</h5>
        <small class="text-light">Record collections against open GST invoices</small>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('payments.new_payment') }}">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Customer <span class="text-danger">*</span></label>
              <select name="customer_id" class="form-select" required id="customerSelect" onchange="filterInvoices()">
                <option value="">-- Select Customer --</option>
                {% for c in customers %}
                <option value="{{ c.id }}" {% if request.args.get('customer_id')|int == c.id %}selected{% endif %}>
                  {{ c.name }} ({{ c.state }})
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Link to Invoice (Optional)</label>
              <select name="invoice_id" class="form-select" id="invoiceSelect" onchange="autoFillOutstanding()">
                <option value="">-- On-Account / Choose Invoice --</option>
                {% for inv in invoices %}
                <option value="{{ inv.id }}" data-customer="{{ inv.customer_id }}" data-outstanding="{{ inv.outstanding }}">
                  {{ inv.number }} — {{ inv.customer_name }} (Outstanding: ₹{{ inv.outstanding }})
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Amount Received (₹) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">₹</span>
                <input type="number" name="amount_received" id="amountInput" class="form-control" step="0.01" min="0.01" required placeholder="0.00">
              </div>
              <small class="text-muted" id="outstandingHelp"></small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Payment Date <span class="text-danger">*</span></label>
              <input type="date" name="payment_date" class="form-control" value="{{ today_date }}" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Payment Mode <span class="text-danger">*</span></label>
              <select name="payment_mode" class="form-select" required>
                <option value="NEFT/RTGS">NEFT / RTGS</option>
                <option value="UPI">UPI / QR Code</option>
                <option value="Cheque">Cheque</option>
                <option value="Cash">Cash</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Reference / UTR / Cheque Number</label>
              <input type="text" name="reference_number" class="form-control" placeholder="e.g. UTR-202611220001">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="Optional notes"></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('payments.index') }}" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="bi bi-check2-circle"></i> Save Payment Receipt
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function filterInvoices() {
    const custId = document.getElementById('customerSelect').value;
    const invSelect = document.getElementById('invoiceSelect');
    const options = invSelect.options;

    for (let i = 1; i < options.length; i++) {
      const opt = options[i];
      if (!custId || opt.getAttribute('data-customer') === custId) {
        opt.style.display = 'block';
      } else {
        opt.style.display = 'none';
      }
    }
  }

  function autoFillOutstanding() {
    const invSelect = document.getElementById('invoiceSelect');
    const selected = invSelect.options[invSelect.selectedIndex];
    const outstanding = selected.getAttribute('data-outstanding');
    const amtInput = document.getElementById('amountInput');
    const help = document.getElementById('outstandingHelp');

    if (outstanding) {
      amtInput.value = outstanding;
      help.textContent = 'Maximum invoice balance: ₹' + outstanding;
    } else {
      help.textContent = '';
    }
  }

  document.addEventListener('DOMContentLoaded', filterInvoices);
</script>
{% endblock %}
